# Sizing for a small box, layered over values.yaml: the settings
# charts/sneakers/examples/values-small-box.yaml gives the old cluster, and room
# for the old cluster's data, which the chart's 10 Gi default may not have.
storage:
  size: 20Gi

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi

agent:
  initResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

postgresql:
  parameters:
    shared_buffers: 64MB
    effective_cache_size: 192MB
    work_mem: 2MB
    maintenance_work_mem: 32MB
    max_connections: "50"
    max_parallel_workers_per_gather: "0"
    # No standby needs the log kept, and the chart's defaults hold gigabytes
    # of it for one.
    max_wal_size: 512MB
    min_wal_size: 64MB
    wal_keep_size: "0"
    max_slot_wal_keep_size: 256MB

# The backups run beside the database on the same small allowance: one upload
# and one disk reader at a time, and a restore check no larger than the
# database itself.
backup:
  env:
    WALG_UPLOAD_CONCURRENCY: "1"
    WALG_UPLOAD_DISK_CONCURRENCY: "1"
    WALG_DOWNLOAD_CONCURRENCY: "1"
  verify:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
