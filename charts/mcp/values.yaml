# Values for the mcp chart. See docs/values.md in this repository.

global:
  # The public host name users reach Sneakers on.
  host: sneakers.example.org
  # ENVIRONMENT for the services. prod or production turn on the production
  # checks (no dev worker token, no dev keys).
  environment: production
  logLevel: error
  logFormat: json
  # OTLP gRPC collector (host:port) for traces and metrics. Empty: unset.
  otlpEndpoint: ""

image:
  repository: ghcr.io/sneakers-pam/sneakers-mcp
  # Empty: the chart's appVersion. A digest, when set, wins over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
fullnameOverride: ""

replicas: 2
strategy: RollingUpdate
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Empty: global.logLevel and global.logFormat.
logLevel: ""
logFormat: ""

service:
  port: 9101
  portName: http
  extraPorts: []

probes:
  type: http
  port: 9101
  path: /health
  startupFailureThreshold: 60

# Non-secret settings, rendered into the ConfigMap. Values go through tpl.
# An empty value is left out, so the service uses its own default.
env:
  ENVIRONMENT: "{{ .Values.global.environment }}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.global.otlpEndpoint }}"
  HTTP_PORT: "9101"
  GATEWAY_MACHINE_GRAPHQL_URL: http://sneakers-gateway:9100/machine/graphql
  MCP_ACCEPT_API_TOKENS: "true"
  MCP_AUTHORIZATION_SERVER: "https://{{ .Values.global.host }}"
  HYDRA_ISSUER: ""
  HYDRA_JWKS_URL: http://sneakers-hydra-public/.well-known/jwks.json
  HYDRA_AUDIENCE: sneakers-mcp
  MCP_RESOURCE_URL: ""
requiredEnv: []

# Secret-backed settings, by variable name. Each one reads key from the
# Secret secretName. generate: true (with no secretName) makes the chart create
# the value once, in <name>-generated, kept on upgrade and uninstall.
secretEnv:
  {}
# Secrets loaded whole as environment variables.
envFromSecrets: []
# Extra container env, Kubernetes format.
extraEnv: []
args: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  automountToken: false

projectedToken:
  enabled: false
  audience: ""
  expirationSeconds: 3600
  mountPath: /var/run/secrets/tokens
  path: token
  clusterCA: false
  envName: ""

# One key of a ConfigMap holding a PEM bundle, pointed to by envName. Go's
# SSL_CERT_FILE replaces the system roots, so the bundle must carry every root
# the service needs.
caBundle:
  configMap: ""
  key: ca-bundle.crt
  mountPath: /etc/ssl/custom
  envName: SSL_CERT_FILE

extraVolumes: []
extraVolumeMounts: []

networkPolicy:
  enabled: true
  # Peers allowed on ingressPorts besides this release's own pods: the
  # ingress controller. The default is any pod in the cluster; narrow it to
  # your controller's namespace.
  ingressFrom:
    - namespaceSelector: {}
  ingressPorts: [http]
  egress: []

ingress:
  enabled: false
  className: ""
  host: "{{ .Values.global.host }}"
  annotations: {}
  tlsSecretName: ""
  paths:
    - path: /mcp
    - path: /.well-known/oauth-protected-resource

migrations:
  job:
    enabled: false
    args: [migrate]
    activeDeadlineSeconds: 600

podLabels: {}
podAnnotations: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "sneakers.fullname" . }}'
