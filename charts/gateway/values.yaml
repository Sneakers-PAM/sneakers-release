# Values for the gateway chart. See docs/values.md in this repository.

global:
  # The public host name users reach Sneakers on.
  host: sneakers.example.org
  # ENVIRONMENT for the services. prod or production turn on the production
  # checks (no dev worker token, no dev keys).
  environment: production
  logLevel: error
  logFormat: json
  # OTLP gRPC collector (host:port) for traces and metrics. Empty: unset.
  otlpEndpoint: ""
  # The one MFA step-up window (MFA_MAX_AGE): how long a fresh sign-in or
  # step-up counts as fresh. A Go duration, 0 to 4h.
  mfaMaxAge: 30m

image:
  repository: ghcr.io/sneakers-pam/sneakers-gateway
  # Empty: the chart's appVersion. A digest, when set, wins over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
fullnameOverride: ""

replicas: 2
strategy: RollingUpdate
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Empty: global.logLevel and global.logFormat.
logLevel: ""
logFormat: ""

service:
  port: 9100
  portName: http
  extraPorts: []

probes:
  type: http
  port: 9100
  # /livez checks the process only; /readyz follows the required dependencies.
  livenessPath: /livez
  readinessPath: /readyz
  startupFailureThreshold: 60

# Non-secret settings, rendered into the ConfigMap. Values go through tpl.
# An empty value is left out, so the service uses its own default.
env:
  ENVIRONMENT: "{{ .Values.global.environment }}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.global.otlpEndpoint }}"
  HTTP_PORT: "9100"
  AUTH_MODE: real
  KRATOS_PUBLIC_URL: http://sneakers-kratos-public
  KRATOS_ADMIN_URL: http://sneakers-kratos-admin
  VAULT_ADDR: sneakers-vault:9091
  IDENTITY_ADDR: sneakers-identity:9192
  WORKFLOW_ADDR: sneakers-workflow:9193
  AUDIT_ADDR: sneakers-audit:9194
  NOTIFY_ADDR: sneakers-notify:9195
  SSHBROKER_ADDR: sneakers-sshbroker:9096
  OAUTH_PUBLIC_URL: "https://{{ .Values.global.host }}"
  COOKIE_SECURE: "true"
  MFA_ENFORCED: "true"
  MFA_MAX_AGE: "{{ .Values.global.mfaMaxAge }}"
  # Machine OIDC through Ory Hydra. Off until the hydra subchart (or your own
  # Hydra) is configured.
  HYDRA_ENABLED: "false"
  HYDRA_ISSUER: ""
  HYDRA_JWKS_URL: http://sneakers-hydra-public:4444/.well-known/jwks.json
  HYDRA_AUDIENCE: sneakers-mcp
requiredEnv: []

# Secret-backed settings, by variable name. Each one reads key from the
# Secret secretName. generate: true (with no secretName) makes the chart create
# the value once, in <name>-generated, kept on upgrade and uninstall.
secretEnv:
  REDIS_URL:
    secretName: ""
    key: redis-url
    required: true
  # Guards first-run setup (/setup/*). Set it for the first admin, then remove it.
  SETUP_TOKEN:
    secretName: ""
    key: SETUP_TOKEN
    required: false
  POLIS_API_KEY:
    secretName: ""
    key: POLIS_API_KEY
    required: false

# SAML single sign-on through your Ory Polis. enabled sets POLIS_PUBLIC_URL
# (the Polis URL the browser is sent to) and POLIS_CLIENT_SECRET, read from
# key in the Secret clientSecret.secretName: the CLIENT_SECRET_VERIFIER your
# Polis runs with. Both are required when enabled; there is no default secret,
# and the gateway refuses Polis's development value. Set the other POLIS_*
# settings in env.
sso:
  enabled: false
  publicURL: ""
  clientSecret:
    secretName: ""
    key: POLIS_CLIENT_SECRET
# Secrets loaded whole as environment variables.
envFromSecrets: []
# ConfigMaps loaded whole as environment variables, after the chart's own, so
# their keys win over env. Each is {name, optional}; optional: true lets the
# pod start while the ConfigMap is absent.
envFromConfigMaps: []
# Extra container env, Kubernetes format.
extraEnv: []
args: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  automountToken: false

projectedToken:
  enabled: false
  audience: ""
  expirationSeconds: 3600
  mountPath: /var/run/secrets/tokens
  path: token
  clusterCA: false
  envName: ""

# Service-to-service authentication. caller mounts a projected token with
# audience `audience` at /var/run/secrets/sneakers/token (WORKLOAD_TOKEN_FILE),
# sent on every gRPC call this service makes. callers are the services allowed
# to reach this service's main port: the NetworkPolicy admits only them, and
# with verify the service checks their tokens against the cluster's issuer
# (WORKLOAD_OIDC_* and WORKLOAD_ALLOWED_SERVICEACCOUNTS, with an API token and
# the cluster CA at /var/run/secrets/tokens). Read the issuer with
# `kubectl get --raw /.well-known/openid-configuration`.
workloadIdentity:
  caller: true
  verify: false
  callers: [mcp]
  audience: sneakers
  expirationSeconds: 3600
  issuer: https://kubernetes.default.svc.cluster.local
  jwksURL: https://kubernetes.default.svc/openid/v1/jwks

# One key of a ConfigMap holding a PEM bundle, pointed to by envName. Go's
# SSL_CERT_FILE replaces the system roots, so the bundle must carry every root
# the service needs.
caBundle:
  configMap: ""
  key: ca-bundle.crt
  mountPath: /etc/ssl/custom
  envName: SSL_CERT_FILE

extraVolumes: []
extraVolumeMounts: []

networkPolicy:
  enabled: true
  # Peers allowed on ingressPorts besides workloadIdentity.callers: the
  # ingress controller. The default is any pod in the cluster; narrow it to
  # your controller's namespace.
  ingressFrom:
    - namespaceSelector: {}
  ingressPorts: [http]
  egress: []

ingress:
  enabled: false
  className: ""
  host: "{{ .Values.global.host }}"
  annotations: {}
  tlsSecretName: ""
  paths:
    - path: /graphql
    - path: /machine
    - path: /auth
    - path: /setup
    - path: /oauth2
    - path: /.well-known/oauth-authorization-server

certManager:
  # false: TLS comes from the Secret named in ingress.tlsSecretName, which you
  # provide. true: the chart creates one Certificate per ingress.host from
  # issuerRef; it never creates an Issuer, a ClusterIssuer or any
  # cert-manager CRD or webhook.
  enabled: false
  issuerRef:
    kind: ClusterIssuer
    name: ""
    group: cert-manager.io

migrations:
  job:
    enabled: false
    args: [migrate]
    activeDeadlineSeconds: 600

podLabels: {}
podAnnotations: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "sneakers.fullname" . }}'
