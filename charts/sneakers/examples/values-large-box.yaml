# Example values for a larger install: three or more nodes with 16 GB or more
# each, for a team that wants the services to ride through a node going down.
# It is an example only, the counterpart of values-small-box.yaml. Nothing in
# the chart or the appliance applies it: copy the keys you want into your own
# values file and change them freely. Every key below is a documented chart
# value (docs/values.md).
#
#   helm install sneakers charts/sneakers -n sneakers --create-namespace \
#     -f charts/sneakers/examples/values-large-box.yaml -f my-values.yaml
#
# Your own values still need global.host and the vault root key
# (docs/install.md). The stateless services run three pods each, spread over
# the nodes, with a PodDisruptionBudget. To scale on CPU instead, set
# <service>.autoscaling.enabled with minReplicas and maxReplicas.

# ---------------------------------------------------------------------------
# Sneakers services.
# ---------------------------------------------------------------------------

identity:
  # Three pods, one per node.
  replicas: 3
  resources:
    # Set aside for each pod by the scheduler.
    requests:
      cpu: 100m
      memory: 128Mi
    # The most each pod may use. Past the memory limit the pod is restarted.
    limits:
      cpu: "2"
      memory: 1Gi

