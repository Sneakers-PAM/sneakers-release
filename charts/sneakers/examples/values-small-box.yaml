# Example values for a small box: a Raspberry Pi 4 or 5 with 4 to 8 GB of
# memory, or a small VM, running the whole release on one node (k3s, k0s or
# kind). It is an example only. Nothing in the chart or the appliance applies
# it: copy the keys you want into your own values file and change them freely.
# Each key in this file is a documented chart value (docs/values.md).
#
#   helm install sneakers charts/sneakers -n sneakers --create-namespace \
#     -f charts/sneakers/examples/values-small-box.yaml -f my-values.yaml
#
# Sized so the memory requests stay under 1 GiB and the limits under 3 GiB
# (scripts/check-resources.py checks both), which leaves room for the
# operating system and Kubernetes on a 4 GB board. Your own values still need
# global.host and the vault root key (docs/install.md).
#
# Every service runs one pod: there is no failover on a single node anyway.
# Raise a limit when its pod is restarted for running out of memory
# (OOMKilled in `kubectl get pods`).

# ---------------------------------------------------------------------------
# Sneakers services. The Go services idle well under 64Mi; the limits leave
# room for bursts.
# ---------------------------------------------------------------------------

identity:
  # One pod.
  replicas: 1
  resources:
    # Set aside for the pod by the scheduler.
    requests:
      cpu: 20m
      memory: 40Mi
    # The most it may use. Past the memory limit the pod is restarted.
    limits:
      cpu: 500m
      memory: 160Mi

