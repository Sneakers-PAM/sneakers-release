# ---------------------------------------------------------------------------
# Bundled pieces.
# ---------------------------------------------------------------------------

# The one shared PostgreSQL, with a database per service plus Kratos and
# Hydra. This block uses the current bundled chart (charts/postgres); it
# changes when sneakers-release#44 replaces that chart with helm-postgres-ha,
# which also brings PgBouncer pooling. Until then each service keeps its own
# small connection pool (the larger of 4 and the node's CPU count).
postgres:
  # The data volume. Grow it with the audit log; it is kept on uninstall.
  persistence:
    size: 5Gi
  resources:
    # Set aside for the pod by the scheduler.
    requests:
      cpu: 50m
      memory: 192Mi
    # The most it may use, shared buffers and /dev/shm included.
    limits:
      cpu: "1"
      memory: 512Mi
  # The memory-backed /dev/shm, for parallel query workers (off below).
  shm:
    sizeLimit: 64Mi
  # Server settings (`-c name=value`).
  parameters:
    # The shared page cache. About a quarter of the pod's memory limit at most.
    shared_buffers: 64MB
    # What the planner assumes the OS caches; no memory is set aside for it.
    effective_cache_size: 192MB
    # Per sort or hash, per query: keep it small with many connections.
    work_mem: 2MB
    # For VACUUM and CREATE INDEX.
    maintenance_work_mem: 32MB
    # The four service pools (4 connections each on a 4-core board), Kratos,
    # Hydra and a few spare for maintenance.
    max_connections: 50
    # No parallel query workers on a small CPU.
    max_parallel_workers_per_gather: 0

# Valkey: sessions, inboxes, SSH tickets and cache invalidation. Small data.
valkey:
  # The data volume.
  dataStorage:
    requestedSize: 512Mi
  # Valkey's own memory cap, below the pod's limit. noeviction refuses new
  # writes at the cap rather than drop sessions.
  valkeyConfig: |
    maxmemory 64mb
    maxmemory-policy noeviction
  resources:
    # Set aside for the pod by the scheduler.
    requests:
      cpu: 20m
      memory: 32Mi
    # The most it may use. Past the memory limit the pod is restarted.
    limits:
      cpu: 500m
      memory: 128Mi
  # The init container that writes the configuration.
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Ory Kratos: the passwords.
kratos:
  # The schema migration that runs before Kratos starts.
  kratos:
    automigration:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
  deployment:
    resources:
      # Set aside for the pod by the scheduler.
      requests:
        cpu: 20m
        memory: 64Mi
      # The most it may use. Past the memory limit the pod is restarted.
      limits:
        cpu: 500m
        memory: 192Mi

# Ory Hydra issues tokens only for machine callers of the MCP server. Off,
# as by default; the sizes below apply if you turn it on.
hydra:
  enabled: false
  # The schema migration that runs before Hydra starts.
  hydra:
    automigration:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
  deployment:
    resources:
      # Set aside for the pod by the scheduler.
      requests:
        cpu: 20m
        memory: 64Mi
      # The most it may use. Past the memory limit the pod is restarted.
      limits:
        cpu: 500m
        memory: 192Mi

# The helm test pod.
tests:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi
