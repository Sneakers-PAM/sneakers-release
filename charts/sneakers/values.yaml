# Values for the sneakers umbrella chart. Every key is described in
# docs/values.md in this repository.
#
# The defaults install everything in one namespace: the Sneakers services plus
# a bundled PostgreSQL, Valkey and Ory Kratos. Two values have no safe default
# and must be set: global.host, and the vault root key (see vault below).

global:
  # The public host name users reach Sneakers on.
  host: sneakers.example.org
  # ENVIRONMENT for the services. prod or production turn on the production
  # checks (no dev worker token, no dev keys).
  environment: production
  logLevel: error
  logFormat: json
  # Where the services and the bundled Kratos and Hydra reach PostgreSQL. The
  # defaults are the bundled charts/postgres.
  database:
    host: sneakers-postgres
    # The libpq sslmode. charts/postgres doesn't serve TLS, so it stays
    # disable with that chart.
    sslmode: disable
  # OTLP gRPC collector URL for traces and metrics, such as http://collector:4317
  # (https:// for TLS). Empty: unset.
  otlpEndpoint: ""
  # Single sign-on: shows the SSO sign-in in the web apps (SSO_ENABLED). Turn
  # it on with the gateway's SSO settings.
  sso:
    enabled: false
  # The one MFA step-up window (MFA_MAX_AGE on the vault, the workflow and
  # the gateway): how long a fresh sign-in or step-up counts as fresh. A Go
  # duration, 0 to 4h.
  mfaMaxAge: 30m
  # The cluster's service account token issuer, which the services check
  # each other's workload tokens against (WORKLOAD_OIDC_ISSUER). Empty: each
  # service's workloadIdentity.issuer, https://kubernetes.default.svc.cluster.local
  # (kubeadm, k3s, kind). Set it once here when the cluster's issuer differs:
  # k0s (and the appliance) is https://kubernetes.default.svc. Read yours with
  # `kubectl get --raw /.well-known/openid-configuration`.
  workloadIdentityIssuer: ""
  # The tag of every Sneakers service image (each service's image.tag still
  # wins). Empty: each chart's appVersion, the tag a final release publishes.
  # Installing from a release candidate, set the rc's tag, such as 0.1.0-rc.3.
  imageTag: ""
  # The CPU architecture every pod runs on: "" (any node), amd64 or arm64.
  # The images are multi-arch, so this only picks the nodes, through a
  # kubernetes.io/arch nodeSelector (a service's own nodeSelector key wins).
  # Valkey, Kratos, Hydra and postgres-ha don't read it: when it's set, also
  # set valkey.nodeSelector and kratos.deployment.nodeSelector (and
  # hydra.deployment.nodeSelector with Hydra on, and postgres-ha.nodeSelector
  # with that on) to the same kubernetes.io/arch,
  # or the chart refuses to render. docs/install.md has the block to copy.
  arch: ""

# Rehearsal mode, for a migration rehearsal (docs/migrate.md). Every pod in
# the namespace may reach only the other pods and the cluster DNS, and the chart
# refuses to render while the connector, the SSH broker or the MCP server is
# on. Never turn it on for a production install.
rehearsal:
  enabled: false
  # The namespace the cluster DNS runs in.
  dnsNamespace: kube-system
  # The Kubernetes API server's endpoint addresses (CIDRs) and port, from
  # `kubectl get endpoints kubernetes`. The services that check caller tokens
  # fetch the cluster's signing keys there, so only they may reach it. Required
  # with rehearsal mode on.
  apiServer:
    addresses: []
    port: 6443

# Secrets shared by the bundled pieces: the PostgreSQL passwords, the Valkey
# password and the REDIS_URL built from it, and the Kratos and Hydra DSNs and
# keys. Each value is generated once and kept on upgrade and uninstall. Turn
# it off when you bring your own PostgreSQL, Valkey and Kratos.
bundledSecrets:
  enabled: true

# ---------------------------------------------------------------------------
# Sneakers services. Each block is the values of that service's chart; see
# charts/<service>/values.yaml for every key.
# ---------------------------------------------------------------------------

identity:
  enabled: true
  env:
    DATABASE_DSN: postgres://sneakers@{{ .Values.global.database.host }}:5432/sneakers_identity?sslmode={{ .Values.global.database.sslmode }}
  secretEnv:
    PGPASSWORD:
      secretName: sneakers-bundled

vault:
  enabled: true
  env:
    DATABASE_DSN: postgres://sneakers@{{ .Values.global.database.host }}:5432/sneakers_vault?sslmode={{ .Values.global.database.sslmode }}
  secretEnv:
    PGPASSWORD:
      secretName: sneakers-bundled
    # Required. Name the Secret holding the root key (32 bytes, base64; make
    # one with `openssl rand -base64 32`), or set generate: true to have the
    # chart create it. Either way, back it up with the database.
    VAULT_ROOT_KEK:
      secretName: ""
      generate: false
    REDIS_URL:
      secretName: sneakers-bundled

workflow:
  enabled: true
  env:
    DATABASE_DSN: postgres://sneakers@{{ .Values.global.database.host }}:5432/sneakers_workflow?sslmode={{ .Values.global.database.sslmode }}
  secretEnv:
    PGPASSWORD:
      secretName: sneakers-bundled

audit:
  enabled: true
  env:
    DATABASE_DSN: postgres://sneakers@{{ .Values.global.database.host }}:5432/sneakers_audit?sslmode={{ .Values.global.database.sslmode }}
  secretEnv:
    PGPASSWORD:
      secretName: sneakers-bundled

notify:
  enabled: true
  secretEnv:
    REDIS_URL:
      secretName: sneakers-bundled

connector:
  enabled: true

sshbroker:
  enabled: true
  secretEnv:
    REDIS_URL:
      secretName: sneakers-bundled

gateway:
  enabled: true
  env:
    # The diagnostics query reads the MCP server's build from its health route.
    # Set it to "" when mcp.enabled is false, so mcp shows as not configured.
    MCP_HEALTH_URL: http://sneakers-mcp:9101/livez
  secretEnv:
    REDIS_URL:
      secretName: sneakers-bundled

mcp:
  enabled: true
# The web apps, on global.host: the staff app at / and the admin app at /admin.
web-staff:
  enabled: true
web-admin:
  enabled: true

# ---------------------------------------------------------------------------
# Bundled third-party pieces. Turn any of them off and point the services at
# your own instead (docs/install.md, "Bring your own").
# ---------------------------------------------------------------------------

# One PostgreSQL instance with a database per service (charts/postgres).
postgres:
  enabled: true
  auth:
    existingSecret: sneakers-bundled

# The cluster the services move to: helm-postgres-ha, off until you choose to
# move (docs/install.md#moving-to-the-helm-postgres-ha-cluster). Turning it on
# starts it empty beside charts/postgres and changes no service: those follow
# global.database. docs/values.md lists what's set here, and the chart's own
# README has every value.
postgres-ha:
  enabled: false

  # Its own name, so it never takes over the old cluster's volume.
  fullnameOverride: sneakers-pgha

  # One member. Failover needs three, and a single node gets nothing from them.
  replicas: 1

  # The image charts/postgres runs, so the two clusters share one PostgreSQL
  # build and a dump comes back with the same collations.
  image:
    repository: library/postgres
    tag: "18.6"
    digest: sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

  agent:
    image:
      tag: "1.0.0"
      digest: sha256:fb3d536548571d67106f6140da144a9e9a53218196feadeda544b5d710e467d4

  postgresql:
    # Your cluster's pod network. Required, and there's no safe default.
    allowedCIDRs: []
    # One member has no standby to wait for.
    synchronous:
      mode: "off"
    # charts/postgres runs in en_US, and identity sorts users and groups by name.
    initdbArgs: "--encoding=UTF8 --locale=en_US.UTF-8 --data-checksums"

  # The superuser and the application role keep the passwords of the old cluster,
  # so a move changes no Secret. The replication and rewind roles aren't used by
  # one member; the chart generates their Secrets.
  credentials:
    superuser:
      existingSecret: sneakers-bundled
      passwordKey: postgres-password

  roles:
    - name: sneakers
      existingSecret: sneakers-bundled
      passwordKey: password

  databases:
    - {name: sneakers_identity, owner: sneakers}
    - {name: sneakers_vault, owner: sneakers}
    - {name: sneakers_workflow, owner: sneakers}
    - {name: sneakers_audit, owner: sneakers}
    - {name: sneakers_kratos, owner: sneakers}
    - {name: sneakers_hydra, owner: sneakers}

  # WAL archives continuously and a base backup runs nightly, to a directory of
  # their own on the backup volume. On a box that volume is the encrypted backup
  # partition. The times are UTC and stay clear of each other.
  backup:
    enabled: true
    storage: file
    # One member, so it's the primary that takes them.
    source: primary
    schedule: "15 1 * * *"
    # Seven nightly base backups and the WAL between them.
    retainFull: 7
    retainDays: 0
    file:
      prefix: walg
      persistence:
        size: 20Gi
        accessModes: [ReadWriteOnce]
    verify:
      enabled: true
      schedule: "45 3 * * *"
      database: sneakers_audit

  # One member needs no pool, and the services keep session state.
  pgbouncer:
    enabled: false

  podDisruptionBudget:
    enabled: false

  affinity:
    zoneSpread: false

  podLabels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/component: postgres

  # Only the pods with a database may connect: the same list as charts/postgres.
  networkPolicy:
    allowedClients:
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: sneakers
            app.kubernetes.io/component: identity
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: sneakers
            app.kubernetes.io/component: vault
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: sneakers
            app.kubernetes.io/component: workflow
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: sneakers
            app.kubernetes.io/component: audit
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: sneakers
            app.kubernetes.io/name: kratos
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: sneakers
            app.kubernetes.io/name: hydra

# Valkey, for sessions, inboxes, SSH tickets and cache invalidation
# (https://github.com/valkey-io/valkey-helm).
valkey:
  enabled: true
  fullnameOverride: sneakers-valkey
  # Lets the chart's own helm test pod past the NetworkPolicy below.
  commonLabels:
    app.kubernetes.io/part-of: sneakers
  image:
    tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
  auth:
    enabled: true
    usersExistingSecret: sneakers-bundled
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: valkey-password
  dataStorage:
    enabled: true
    requestedSize: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
  readinessProbe:
    enabled: true
    timeoutSeconds: 3
  # The chart's 1 s timeouts and 30 s startup window are too tight for a
  # small box loading its dataset at boot.
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  livenessProbe:
    timeoutSeconds: 3
  # Only the services that use Valkey (REDIS_URL) may connect.
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/part-of: sneakers
                app.kubernetes.io/component: gateway
          - podSelector:
              matchLabels:
                app.kubernetes.io/part-of: sneakers
                app.kubernetes.io/component: vault
          - podSelector:
              matchLabels:
                app.kubernetes.io/part-of: sneakers
                app.kubernetes.io/component: notify
          - podSelector:
              matchLabels:
                app.kubernetes.io/part-of: sneakers
                app.kubernetes.io/component: sshbroker
        ports:
          - port: 6379

# Ory Kratos holds the passwords (https://github.com/ory/k8s). Headless: the
# gateway drives the flows, so no Kratos UI is deployed.
kratos:
  enabled: true
  fullnameOverride: sneakers-kratos
  image:
    tag: v1.3.1@sha256:fe2428f103a6240c064b6ea77d3088610865c55fcebccb30355857eccdc25b4b
  secret:
    enabled: false
    nameOverride: sneakers-kratos
  # The identity service sends the mail, so the Kratos courier isn't run.
  courier:
    enabled: false
  deployment:
    podMetadata:
      labels:
        app.kubernetes.io/part-of: sneakers
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # The chart's startup probe asks /admin/health/ready, which needs the
    # database, and gives up after about 5 s, so Kratos was restarted
    # whenever PostgreSQL came up after it. Startup asks the process only
    # (alive), with a 5-minute window; readiness still follows the database.
    customStartupProbe:
      httpGet:
        path: /admin/health/alive
        port: 4434
        httpHeaders:
          - name: Host
            value: "127.0.0.1"
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readinessProbe:
      timeoutSeconds: 3
    automigration:
      extraEnv: []
  kratos:
    automigration:
      enabled: true
      type: initContainer
    identitySchemas:
      identity.default.schema.json: |
        {
          "$id": "https://schemas.example.org/sneakers/identity.default.schema.json",
          "$schema": "http://json-schema.org/draft-07/schema#",
          "title": "Sneakers identity",
          "type": "object",
          "properties": {
            "traits": {
              "type": "object",
              "properties": {
                "email": {
                  "type": "string",
                  "format": "email",
                  "title": "Email",
                  "minLength": 3,
                  "ory.sh/kratos": {
                    "credentials": { "password": { "identifier": true } },
                    "recovery": { "via": "email" }
                  }
                },
                "first_name": { "type": "string", "title": "First name" },
                "last_name": { "type": "string", "title": "Last name" }
              },
              "required": ["email"],
              "additionalProperties": false
            }
          }
        }
    config:
      serve:
        public:
          base_url: http://sneakers-kratos-public/
          port: 4433
          cors:
            enabled: false
        admin:
          base_url: http://sneakers-kratos-admin/
          port: 4434
      log:
        level: error
        format: json
        leak_sensitive_values: false
      identity:
        default_schema_id: default
        schemas:
          - id: default
            url: file:///etc/config/identity.default.schema.json
      session:
        lifespan: 24h
        cookie:
          same_site: Lax
          path: /
      # Kratos sends no mail in Sneakers (the identity service does), but its
      # configuration needs an SMTP URI.
      courier:
        smtp:
          connection_uri: smtp://smtp.example.org:25/?disable_starttls=true
          from_address: "no-reply@{{ .Values.global.host }}"
          from_name: Sneakers
      # Second factors belong to the identity service, so Kratos's own TOTP
      # and WebAuthn stay off. Recovery codes are minted through the admin API.
      selfservice:
        default_browser_return_url: "https://{{ .Values.global.host }}/"
        allowed_return_urls:
          - "https://{{ .Values.global.host }}/"
        methods:
          password:
            enabled: true
          code:
            enabled: true
          totp:
            enabled: false
          webauthn:
            enabled: false
        flows:
          settings:
            ui_url: "https://{{ .Values.global.host }}/settings"
            privileged_session_max_age: 15m
          recovery:
            enabled: true
            use: code
            ui_url: "https://{{ .Values.global.host }}/recovery"
          login:
            ui_url: "https://{{ .Values.global.host }}/login"
            lifespan: 10m

# Ory Hydra issues client-credentials tokens for machine callers of the MCP
# server (https://github.com/ory/k8s). Off by default; to use it, enable it,
# set hydra.hydra.config.urls.self.issuer, and set HYDRA_ENABLED and
# HYDRA_ISSUER on the gateway and HYDRA_ISSUER and MCP_RESOURCE_URL on mcp.
hydra:
  enabled: false
  fullnameOverride: sneakers-hydra
  image:
    tag: v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
  maester:
    enabled: false
  secret:
    enabled: false
    nameOverride: sneakers-hydra
  deployment:
    podMetadata:
      labels:
        app.kubernetes.io/part-of: sneakers
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # As for Kratos: startup asks the process only (alive), with a 5-minute
    # window, instead of /health/ready (which needs the database) for 5 s.
    customStartupProbe:
      httpGet:
        path: /health/alive
        port: 4445
        httpHeaders:
          - name: Host
            value: "127.0.0.1"
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readinessProbe:
      timeoutSeconds: 3
  hydra:
    automigration:
      enabled: true
      type: initContainer
    config:
      serve:
        public:
          port: 4444
        admin:
          port: 4445
      log:
        level: error
        format: json
        leak_sensitive_values: false
      oauth2:
        expose_internal_errors: false
      strategies:
        access_token: jwt
        jwt:
          scope_claim: both
      ttl:
        access_token: 10m
      urls:
        self:
          issuer: "https://hydra.{{ .Values.global.host }}/"

# NetworkPolicies for the bundled Kratos and Hydra, whose charts have none.
# Kratos public takes only the gateway (it drives the flows), Kratos admin the
# identity service and the gateway. Hydra public takes the gateway, the MCP
# server and hydraPublicFrom (OAuth clients reach the issuer through the
# edge; narrow it to your ingress controller's namespace). Hydra admin takes
# only Hydra's own pods (the chart's helm test): manage its clients with
# kubectl port-forward. Kratos admin also takes Kratos's own pods, and
# kratosAdminFrom (the sneakers-migrate Jobs during a migration).
bundledNetworkPolicies:
  enabled: true
  kratosPublicFrom: []
  kratosAdminFrom: []
  hydraPublicFrom:
    - namespaceSelector: {}

tests:
  image:
    repository: docker.io/curlimages/curl
    tag: "8.22.0"
    digest: sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi
