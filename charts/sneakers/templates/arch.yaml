{{- /*
global.arch pins the Sneakers services, PostgreSQL and the smoke test to one
architecture. The Valkey, Kratos and Hydra charts don't read global values, so
each enabled one must carry the same kubernetes.io/arch in its own nodeSelector,
or part of the install would land on any node. The chart refuses to render
until they match, naming the key to set.
*/ -}}
{{- with $.Values.global.arch }}
{{- $arch := . }}
{{- $keys := list }}
{{- if $.Values.valkey.enabled }}
{{- $keys = append $keys (list "valkey" (list "nodeSelector")) }}
{{- end }}
{{- range $chart := list "kratos" "hydra" }}
{{- $v := index $.Values $chart }}
{{- if $v.enabled }}
{{- $keys = append $keys (list $chart (list "deployment" "nodeSelector")) }}
{{- if dig "job" "nodeSelector" dict $v }}
{{- $keys = append $keys (list $chart (list "job" "nodeSelector")) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $.Values.kratos.enabled (dig "courier" "enabled" false $.Values.kratos) }}
{{- $keys = append $keys (list "kratos" (list "statefulSet" "nodeSelector")) }}
{{- end }}
{{- if and $.Values.kratos.enabled (dig "cleanup" "enabled" false $.Values.kratos) }}
{{- $keys = append $keys (list "kratos" (list "cronjob" "cleanup" "nodeSelector")) }}
{{- end }}
{{- if and $.Values.hydra.enabled (dig "janitor" "enabled" false $.Values.hydra) }}
{{- $keys = append $keys (list "hydra" (list "cronjob" "janitor" "nodeSelector")) }}
{{- end }}
{{- range $k := $keys }}
{{- $sel := index $.Values (index $k 0) }}
{{- range $p := index $k 1 }}
{{- $sel = (get $sel $p) | default dict }}
{{- end }}
{{- $path := printf "%s.%s" (index $k 0) (join "." (index $k 1)) }}
{{- if ne (get $sel "kubernetes.io/arch" | toString) $arch }}
{{- fail (printf "global.arch is %s: set kubernetes.io/arch: %s in %s too (that chart doesn't read global values)" $arch $arch $path) }}
{{- end }}
{{- end }}
{{- end }}
