{{- /*
The Secrets the bundled pieces share. Every value is generated on the first
install and read back with lookup afterwards, so upgrades keep it. They are
kept on uninstall too, with the PostgreSQL volume they unlock.
*/ -}}
{{- if .Values.bundledSecrets.enabled }}
{{- $ns := .Release.Namespace }}
{{- $old := (lookup "v1" "Secret" $ns "sneakers-bundled").data | default dict }}
{{- $pw := index $old "password" | default (randAlphaNum 32 | b64enc) }}
{{- $superPw := index $old "postgres-password" | default (randAlphaNum 32 | b64enc) }}
{{- $valkeyPw := index $old "valkey-password" | default (randAlphaNum 32 | b64enc) }}
{{- $pgHost := printf "%s:5432" .Values.postgres.fullnameOverride }}
apiVersion: v1
kind: Secret
metadata:
  name: sneakers-bundled
  labels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.postgres.enabled }}
  password: {{ $pw }}
  postgres-password: {{ $superPw }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  valkey-password: {{ $valkeyPw }}
  redis-url: {{ printf "redis://:%s@%s:6379/0" (b64dec $valkeyPw) .Values.valkey.fullnameOverride | b64enc }}
  {{- end }}
{{- if and .Values.kratos.enabled .Values.postgres.enabled }}
{{- $k := (lookup "v1" "Secret" $ns .Values.kratos.secret.nameOverride).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kratos.secret.nameOverride }}
  labels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  dsn: {{ printf "postgres://%s:%s@%s/sneakers_kratos?sslmode=disable" .Values.postgres.auth.username (b64dec $pw) $pgHost | b64enc }}
  secretsDefault: {{ index $k "secretsDefault" | default (randAlphaNum 32 | b64enc) }}
  secretsCookie: {{ index $k "secretsCookie" | default (randAlphaNum 32 | b64enc) }}
  secretsCipher: {{ index $k "secretsCipher" | default (randAlphaNum 32 | b64enc) }}
  smtpConnectionURI: {{ .Values.kratos.kratos.config.courier.smtp.connection_uri | b64enc }}
{{- end }}
{{- if and .Values.hydra.enabled .Values.postgres.enabled }}
{{- $h := (lookup "v1" "Secret" $ns .Values.hydra.secret.nameOverride).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hydra.secret.nameOverride }}
  labels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  dsn: {{ printf "postgres://%s:%s@%s/sneakers_hydra?sslmode=disable" .Values.postgres.auth.username (b64dec $pw) $pgHost | b64enc }}
  secretsSystem: {{ index $h "secretsSystem" | default (randAlphaNum 32 | b64enc) }}
  secretsCookie: {{ index $h "secretsCookie" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
{{- end }}
