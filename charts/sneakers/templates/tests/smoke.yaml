{{- /*
helm test: the edge services and both web apps answer their health checks.
Kratos isn't checked here: its NetworkPolicy admits only the identity service
and the gateway, and helm install --wait already waits for it to be ready.
*/ -}}
apiVersion: v1
kind: Pod
metadata:
  name: sneakers-smoke-test
  labels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}{{ with .Values.tests.image.digest }}@{{ . }}{{ end }}"
      command: [/bin/sh, -c]
      args:
        - |
          set -eu
          check() { echo "checking $1"; curl -fsS --max-time 10 --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$1"; }
          {{- if .Values.gateway.enabled }}
          check http://sneakers-gateway:9100/health
          {{- end }}
          {{- if .Values.mcp.enabled }}
          check http://sneakers-mcp:9101/health
          {{- end }}
          {{- if (index .Values "web-staff").enabled }}
          check http://sneakers-web-staff:3000/healthz
          {{- end }}
          {{- if (index .Values "web-admin").enabled }}
          check http://sneakers-web-admin:3000/admin/healthz
          {{- end }}
          {{- if .Values.sshbroker.enabled }}
          check http://sneakers-sshbroker:9097/health
          {{- end }}
          echo ok
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
