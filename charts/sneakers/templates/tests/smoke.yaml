{{- /* helm test: the edge services and Kratos answer their health checks. */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: sneakers-smoke-test
  labels:
    app.kubernetes.io/part-of: sneakers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}{{ with .Values.tests.image.digest }}@{{ . }}{{ end }}"
      command: [/bin/sh, -c]
      args:
        - |
          set -eu
          check() { echo "checking $1"; curl -fsS --max-time 10 --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$1"; }
          {{- if .Values.gateway.enabled }}
          check http://sneakers-gateway:9100/health
          {{- end }}
          {{- if .Values.mcp.enabled }}
          check http://sneakers-mcp:9101/health
          {{- end }}
          {{- if .Values.sshbroker.enabled }}
          check http://sneakers-sshbroker:9097/health
          {{- end }}
          {{- if .Values.kratos.enabled }}
          check http://{{ .Values.kratos.fullnameOverride }}-admin/health/ready
          {{- end }}
          echo ok
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
