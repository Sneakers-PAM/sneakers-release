# Values for the bundled PostgreSQL. See docs/values.md in this repository.

fullnameOverride: sneakers-postgres

image:
  repository: docker.io/library/postgres
  tag: "18.6"
  digest: sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
  pullPolicy: IfNotPresent
imagePullSecrets: []

auth:
  # Secret holding both passwords. Required.
  existingSecret: ""
  # The application role that owns every database below.
  username: sneakers
  passwordKey: password
  # The postgres superuser.
  superuserPasswordKey: postgres-password

# Created on the first start only (an empty data directory). Later additions
# have to be created by hand.
databases:
  - sneakers_identity
  - sneakers_vault
  - sneakers_workflow
  - sneakers_audit
  - sneakers_kratos
  - sneakers_hydra

persistence:
  size: 10Gi
  # Empty: the cluster's default StorageClass.
  storageClass: ""
  accessModes: [ReadWriteOnce]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# Server settings, each passed as `-c <name>=<value>`. Empty: the image's
# defaults. Use it to size PostgreSQL to the box, for example shared_buffers,
# work_mem, maintenance_work_mem and max_connections.
parameters: {}

# Seconds each probe (pg_isready) waits for an answer. The kubelet's 1 s
# default times out on a small box under boot or checkpoint load, and failed
# liveness probes restart the database.
probes:
  timeoutSeconds: 5

# The memory-backed /dev/shm, used for parallel query workers. It counts
# against the pod's memory.
shm:
  sizeLimit: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

# Only the pods matching one of these label sets, in this namespace, may
# connect: the services with a database, and the bundled Kratos and Hydra.
networkPolicy:
  enabled: true
  from:
    - app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/component: identity
    - app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/component: vault
    - app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/component: workflow
    - app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/component: audit
    - app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/name: kratos
    - app.kubernetes.io/part-of: sneakers
      app.kubernetes.io/name: hydra

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
