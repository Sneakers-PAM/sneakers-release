apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-init
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  10-sneakers.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v app_user="$APP_USER" -v app_password="$APP_PASSWORD" <<'SQL'
    CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password';
    SQL
    for db in $APP_DATABASES; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -v db="$db" -v app_user="$APP_USER" <<'SQL'
    CREATE DATABASE :"db" OWNER :"app_user";
    SQL
    done
