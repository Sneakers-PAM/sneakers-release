# The pinned Sneakers release: every component at one version. A release is
# applied whole, never in part. The charts in charts/ pin the same versions;
# scripts/check-manifest.py fails CI when the two disagree.
#
# Service image digests are placeholders until the first release. Each
# service's build block names the source its image is built from: the
# repository, the full commit, the Dockerfile and its context, and the
# target and build arguments when it has them. The appliance's release
# workflow builds every service image from that block, pushes it to GHCR by
# digest and puts the digest in place of sha256:TBD-at-release in the
# release.yaml it ships and countersigns. test/kind/services.txt builds the
# same commits for the install test; scripts/check-manifest.py fails when the
# two disagree.
apiVersion: sneakers-pam/v1alpha1
kind: Release
metadata:
  version: 0.1.0
spec:
  charts:
    sneakers:
      version: 0.1.0
      source: charts/sneakers
  services:
    identity:
      image: ghcr.io/sneakers-pam/sneakers-identity
      source: https://github.com/Sneakers-PAM/sneakers-identity
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-identity
        commit: 6bcc7192e42a093c23be7d423b34a0d51a4f4139
        dockerfile: Dockerfile
        context: .
    vault:
      image: ghcr.io/sneakers-pam/sneakers-vault
      source: https://github.com/Sneakers-PAM/sneakers-vault
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-vault
        commit: 921421ab89cb1a564b004463477fa540966d326b
        dockerfile: Dockerfile
        context: .
        target: vault
    workflow:
      image: ghcr.io/sneakers-pam/sneakers-workflow
      source: https://github.com/Sneakers-PAM/sneakers-vault
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-vault
        commit: 921421ab89cb1a564b004463477fa540966d326b
        dockerfile: Dockerfile
        context: .
        target: workflow
    audit:
      image: ghcr.io/sneakers-pam/sneakers-audit
      source: https://github.com/Sneakers-PAM/sneakers-audit
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-audit
        commit: f1d56e8b1d0efcf53cb4a3ea6f7a8ab7e98eda62
        dockerfile: Dockerfile
        context: .
    notify:
      image: ghcr.io/sneakers-pam/sneakers-notify
      source: https://github.com/Sneakers-PAM/sneakers-notify
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-notify
        commit: 6eef73d3564773ecc2c50779e8dff7692ee73f10
        dockerfile: Dockerfile
        context: .
    connector:
      image: ghcr.io/sneakers-pam/sneakers-connector
      source: https://github.com/Sneakers-PAM/sneakers-connector
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-connector
        commit: 66d5d109e73f916846fabb75fe621f568cf39dc1
        dockerfile: Dockerfile
        context: .
    sshbroker:
      image: ghcr.io/sneakers-pam/sneakers-sshbroker
      source: https://github.com/Sneakers-PAM/sneakers-sshbroker
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-sshbroker
        commit: dfd60e0946cbe19ee2c5c198c8d6f2d95fee8f95
        dockerfile: Dockerfile
        context: .
    gateway:
      image: ghcr.io/sneakers-pam/sneakers-gateway
      source: https://github.com/Sneakers-PAM/sneakers-gateway
