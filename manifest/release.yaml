    web-staff:
      image: ghcr.io/sneakers-pam/sneakers-web-staff
      source: https://github.com/Sneakers-PAM/sneakers-web
      version: 0.1.0
      digest: sha256:TBD-at-release
      build:
        repository: Sneakers-PAM/sneakers-web
        commit: 63aa7e08f227ac34e17d9a42973044f64f1faef3
        dockerfile: Dockerfile
        context: .
        args:
          APP: staff
    web-admin:
      image: ghcr.io/sneakers-pam/sneakers-web-admin
      source: https://github.com/Sneakers-PAM/sneakers-web
      version: 0.1.0
      digest: sha256:TBD-at-release
