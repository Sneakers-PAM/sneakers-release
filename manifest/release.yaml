# The pinned Sneakers release: every component at one version. A release is
# applied whole, never in part. The charts in charts/ pin the same versions;
# scripts/check-manifest.py fails CI when the two disagree.
#
# Service image digests are placeholders until the first release: the images
# are built and pushed to GHCR on tag, and the release replaces each
# sha256:TBD-at-release with the digest that was pushed and signed.
apiVersion: sneakers-pam/v1alpha1
kind: Release
metadata:
  version: 0.1.0
spec:
  charts:
    sneakers:
      version: 0.1.0
      source: charts/sneakers
  services:
    identity:
      image: ghcr.io/sneakers-pam/sneakers-identity
      source: https://github.com/Sneakers-PAM/sneakers-identity
      version: 0.1.0
      digest: sha256:TBD-at-release
    vault:
      image: ghcr.io/sneakers-pam/sneakers-vault
      source: https://github.com/Sneakers-PAM/sneakers-vault
      version: 0.1.0
      digest: sha256:TBD-at-release
    workflow:
      image: ghcr.io/sneakers-pam/sneakers-workflow
      source: https://github.com/Sneakers-PAM/sneakers-vault
      version: 0.1.0
      digest: sha256:TBD-at-release
    audit:
      image: ghcr.io/sneakers-pam/sneakers-audit
      source: https://github.com/Sneakers-PAM/sneakers-audit
      version: 0.1.0
      digest: sha256:TBD-at-release
    notify:
      image: ghcr.io/sneakers-pam/sneakers-notify
      source: https://github.com/Sneakers-PAM/sneakers-notify
      version: 0.1.0
      digest: sha256:TBD-at-release
    connector:
      image: ghcr.io/sneakers-pam/sneakers-connector
      source: https://github.com/Sneakers-PAM/sneakers-connector
      version: 0.1.0
      digest: sha256:TBD-at-release
    sshbroker:
      image: ghcr.io/sneakers-pam/sneakers-sshbroker
      source: https://github.com/Sneakers-PAM/sneakers-sshbroker
      version: 0.1.0
      digest: sha256:TBD-at-release
    gateway:
      image: ghcr.io/sneakers-pam/sneakers-gateway
      source: https://github.com/Sneakers-PAM/sneakers-gateway
      version: 0.1.0
      digest: sha256:TBD-at-release
    mcp:
      image: ghcr.io/sneakers-pam/sneakers-mcp
      source: https://github.com/Sneakers-PAM/sneakers-mcp
      version: 0.1.0
      digest: sha256:TBD-at-release
  kubernetes:
    k0s:
      version: v1.36.4+k0s.1
      source: https://github.com/k0sproject/k0s/releases/tag/v1.36.4%2Bk0s.1
      sha256:
        amd64: 18c304d53cdd70095e99c6b859b269b4fef0bb84579d7e7185271a9135694a31
        arm64: 04f685c8c9c29262da64acf26fd928452f19d449ac58729592f686f915882319
  thirdParty:
    postgres:
      chart:
        name: postgres
        version: 0.1.0
        repository: charts/postgres
      image: docker.io/library/postgres
      version: "18.6"
      digest: sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    valkey:
      chart:
        name: valkey
        version: 0.12.0
        repository: https://valkey.io/valkey-helm/
      image: docker.io/valkey/valkey
      version: 9.1.2
      digest: sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    kratos:
      chart:
        name: kratos
        version: 0.59.0
        repository: https://k8s.ory.sh/helm/charts
      image: docker.io/oryd/kratos
      version: v1.3.1
      digest: sha256:fe2428f103a6240c064b6ea77d3088610865c55fcebccb30355857eccdc25b4b
    hydra:
      chart:
        name: hydra
        version: 0.59.0
        repository: https://k8s.ory.sh/helm/charts
      image: docker.io/oryd/hydra
      version: v2.3.0
      digest: sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
  tools:
    # The helm test pod.
    curl:
      image: docker.io/curlimages/curl
      version: 8.22.0
      digest: sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
