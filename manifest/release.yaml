          digest: sha256:1dca17073186db812f380970077f5c82842c810f1bd75800cd926ab50cd34243
        - image: quay.io/k0sproject/kube-proxy
          digest: sha256:e043ea8217fdab1ffc3d2ca880d5a16ab9dc462589d75fba45d0c09c477b03f7
        - image: quay.io/k0sproject/coredns
          digest: sha256:513b8c9d2e09a90169ca660b7c1ad76fe366ac59a464d7b1a8637e64150e1b31
        - image: quay.io/k0sproject/kube-router
          digest: sha256:c538cbd79d9ac7fcacab7470993037527e94d19af09a7540d1b3c0a129a73a92
        - image: quay.io/k0sproject/cni-node
          digest: sha256:2d1bf841d4773aa00cc4b2e5efcf39f2a026996dc6355ea6641a8672cdce8371
  thirdParty:
    postgres:
      chart:
        name: postgres
        version: 0.1.0
