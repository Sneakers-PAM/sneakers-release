name: checks
# The org's scrub (gitleaks, generic identifier patterns, DCO) over the PR's
# commits, title and body. The ruleset on main requires its `checks / scrub`
# status, so the caller job keeps the id `checks`. `edited` reruns it when the
# PR title or body changes.
#
# proto-sync checks on each PR that go.mod has no replace directive and no
# owner package at a pseudo-version, and the callee proto pins in
# proto-refs.env; proto-refresh opens a PR on the schedule that bumps stale
# pins, and only that job can write.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "41 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push')
      && github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # valkey.io: the public Helm repository of the bundled Valkey chart.
      # filippo.io, c2sp.org, gonum.org: Go module paths (age and its test
      # vectors, gonum through the OpenTelemetry deps). The last one is not a
      # host: protoc's descriptor bytes in gen/go/thirdparty/vault run a message
      # name into the go_package path. cert-manager.io: the Certificate CRD's
      # apiVersion group, the bring-your-own-cert-manager opt-in.
      allowed-domains: >-
        valkey.io
        filippo.io
        c2sp.org
        gonum.org
        x1a9.sneakers.vault.v1.getheartbeatstatusforprincipalresponsebmzkgithub.com
        cert-manager.io
  proto-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    permissions:
      contents: read
    uses: Sneakers-PAM/.github/.github/workflows/proto-sync.yml@77dd2ac5815c0adb982872341813ada8511a3ab5
    with:
      tools-ref: 77dd2ac5815c0adb982872341813ada8511a3ab5
  proto-refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: Sneakers-PAM/.github/.github/workflows/proto-sync.yml@77dd2ac5815c0adb982872341813ada8511a3ab5
    with:
      tools-ref: 77dd2ac5815c0adb982872341813ada8511a3ab5
