# The deny-egress policy of a rehearsal namespace, for an install that doesn't
# use the umbrella chart's rehearsal.enabled (which renders the same policy).
# Every pod may reach only other pods in the namespace and the cluster DNS; the
# services that check caller tokens may also reach the Kubernetes API server,
# where they fetch the cluster's signing keys. Fill ${NAMESPACE},
# ${API_SERVER_CIDR} and ${API_SERVER_PORT} (kubectl get endpoints kubernetes)
# with envsubst.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sneakers-rehearsal-egress
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sneakers-rehearsal-api-server
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [audit, identity, notify, sshbroker, vault, workflow]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: "${API_SERVER_CIDR}"
      ports:
        - port: ${API_SERVER_PORT}
          protocol: TCP
