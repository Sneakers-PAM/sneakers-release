# Rehearsal mode for a migration rehearsal: no automation and no egress out of
# the namespace. The vault and audit list migrate as a caller (their defaults
# plus migrate), so the import and verify Jobs pass their NetworkPolicy and
# token check.
# Layer it over the install's own values (test/kind/values.yaml here).
rehearsal:
  enabled: true

connector:
  enabled: false

sshbroker:
  enabled: false

mcp:
  enabled: false

vault:
  workloadIdentity:
    callers: [gateway, workflow, sshbroker, connector, migrate]

audit:
  workloadIdentity:
    callers: [gateway, vault, sshbroker, identity, workflow, migrate]
